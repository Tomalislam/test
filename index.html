<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintFlow | Digital Printing Made Simple</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(45deg, #6a11cb, #ff6b6b);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 1100px;
            height: 700px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        .design-side {
            position: relative;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .animated-logo {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 4s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .animated-logo img {
            width: 80%;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .form-container {
            padding: 50px;
            position: relative;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #6a11cb;
            outline: none;
            box-shadow: 0 0 10px rgba(106, 17, 203, 0.2);
        }

        .toggle-form {
            position: absolute;
            top: 40px;
            right: 40px;
            display: flex;
            gap: 10px;
        }

        .toggle-btn {
            padding: 10px 20px;
            border: none;
            background: #6a11cb;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: #2575fc;
            transform: scale(1.05);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #6a11cb, #2575fc);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: translateY(-3px);
            background: #6a11cb;
            color: white;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                width: 90%;
                height: auto;
            }

            .design-side {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="design-side">
            <div class="animated-logo">
                <img src="file.svg" alt="PrintFlow Logo">
            </div>
        </div>
        <div class="form-container">
            <div class="toggle-form">
                <button class="toggle-btn active">Sign In</button>
                <button class="toggle-btn">Sign Up</button>
            </div>
            
            <form id="loginForm" class="form" style="display: block;">
                <h2>Welcome Back! 🖨️</h2>
                <p class="subtext">Print your ideas in few clicks</p>
                
                <div class="form-group">
                    <input type="email" placeholder="Email" required>
                </div>
                
                <div class="form-group">
                    <input type="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="submit-btn">Print My Session</button>
                
                <div class="social-login">
                    <div class="social-icon">G</div>
                    <div class="social-icon">F</div>
                    <div class="social-icon">In</div>
                </div>
            </form>

            <form id="signupForm" class="form" style="display: none;">
                <h2>New Here? 📄</h2>
                <p class="subtext">Start your printing journey</p>
                
                <div class="form-group">
                    <input type="text" placeholder="Full Name" required>
                </div>
                
                <div class="form-group">
                    <input type="email" placeholder="Email" required>
                </div>
                
                <div class="form-group">
                    <input type="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        const toggleButtons = document.querySelectorAll('.toggle-btn');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        toggleButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                toggleButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                if(btn.textContent === 'Sign In') {
                    loginForm.style.display = 'block';
                    signupForm.style.display = 'none';
                } else {
                    loginForm.style.display = 'none';
                    signupForm.style.display = 'block';
                }
            });
        });

        // Add form validation and submission handling
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                // Add your form submission logic here
                console.log('Form submitted!');
                // Add loading animation
                form.querySelector('.submit-btn').innerHTML = 'Processing...';
                setTimeout(() => {
                    form.querySelector('.submit-btn').innerHTML = 'Success!';
                }, 1500);
            });
        });
    </script>
</body>
</html>
